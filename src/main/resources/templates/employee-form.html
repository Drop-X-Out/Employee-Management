<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${employee.id == 0 ?
                     'Add Employee' :
                     'Edit Employee'}">
        Employee Form
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="form-container">

    <h1
            th:text="${employee.id == 0 ?
                  'Add Employee' :
                  'Edit Employee'}">
        Add Employee
    </h1>


    <form th:action="@{/save-employee}"
          method="post">

        <input type="hidden"
               name="id"
               th:value="${employee.id}">


        <label>Name</label>

        <input type="text"
               name="name"
               th:value="${employee.name}"
               required>


        <label>Email</label>

        <input type="email"
               name="email"
               th:value="${employee.email}"
               required>


        <label>Department</label>

        <input type="text"
               name="department"
               th:value="${employee.department}"
               required>


        <label>Salary</label>

        <input type="number"
               name="salary"
               step="0.01"
               th:value="${employee.salary}"
               required>


        <button type="submit">
            Save Employee
        </button>

    </form>


    <br>

    <a th:href="@{/employees}">
        Back to Employees
    </a>

</div>

</body>

</html>
